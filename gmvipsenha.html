<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08111d">
  <meta name="description" content="Biblioteca VIP de senhas para gamemodes do Portal SiqueiraX.">
  <title>Senhas GM VIP • Portal SiqueiraX</title>

  <link rel="icon" href="https://i.imgur.com/eKjFtd1.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/eKjFtd1.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#08111d;--bg-soft:#0b1625;--surface:#0f1d2f;--surface-2:#13253b;
      --blue:#2b82d4;--blue-dark:#1e5f9e;--blue-light:#7dbbf0;
      --red:#d63d55;--red-dark:#9f2a3e;--red-soft:rgba(214,61,85,.11);
      --green:#4bd29a;--warn:#f2ba63;--text:#f4f7fb;--muted:#98aabd;
      --line:#223750;--line-soft:rgba(255,255,255,.06);--radius:15px;
      --shadow:0 14px 34px rgba(0,0,0,.27);--max:1180px;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{min-height:100vh;overflow-x:hidden;font-family:"Inter",sans-serif;color:var(--text);background:linear-gradient(rgba(8,17,29,.95),rgba(8,17,29,.985)),url("https://i.imgur.com/eKjFtd1.png") center/cover fixed no-repeat}
    body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(43,130,212,.04) 1px,transparent 1px),linear-gradient(rgba(43,130,212,.04) 1px,transparent 1px);background-size:38px 38px}
    a{text-decoration:none;color:inherit}button,input{font:inherit}.wrap{width:min(var(--max),calc(100% - 28px));margin-inline:auto}

    .topbar{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line-soft);background:rgba(7,14,24,.94);backdrop-filter:blur(10px)}
    .nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .brand{display:flex;align-items:center;gap:12px}.brand img{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.12);box-shadow:0 0 0 4px rgba(43,130,212,.07)}
    .brand-copy{display:flex;flex-direction:column;line-height:1}.brand-copy strong{font-family:"Rajdhani",sans-serif;font-size:1.3rem}.brand-copy small{margin-top:4px;color:var(--blue-light);font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .nav-actions{display:flex;align-items:center;gap:9px}.nav-button,.user{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);font-size:.74rem;font-weight:800}
    .nav-button:hover{background:rgba(43,130,212,.08);border-color:rgba(125,187,240,.35)}.user i{color:#ff8094}.user small{color:var(--muted);font-weight:700}

    .hero{padding:42px 0 18px}.hero-card{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px;padding:29px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(120deg,rgba(20,43,70,.97),rgba(13,29,48,.97));box-shadow:var(--shadow)}
    .hero-card::after{content:"";position:absolute;top:0;right:0;width:7px;height:100%;background:linear-gradient(var(--blue),var(--red))}.eyebrow,.section-label{display:inline-flex;align-items:center;gap:7px;color:var(--blue-light);font-size:.67rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
    h1{margin:12px 0 9px;font-family:"Rajdhani",sans-serif;font-size:clamp(2.5rem,5vw,4.1rem);line-height:.94}.hero-card p{max-width:700px;color:var(--muted);font-size:.85rem;line-height:1.65}.hero-stat{min-width:170px;padding:15px;border:1px solid var(--line-soft);border-radius:10px;background:rgba(255,255,255,.025)}.hero-stat span{display:block;color:var(--muted);font-size:.65rem;font-weight:700;text-transform:uppercase}.hero-stat strong{display:block;margin-top:4px;font-family:"Rajdhani",sans-serif;font-size:1.65rem}

    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px auto}.search-box{position:relative;flex:1;max-width:560px}.search-box i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--blue-light);font-size:.8rem}.search-box input{width:100%;min-height:45px;padding:0 14px 0 39px;border:1px solid var(--line);border-radius:10px;outline:none;color:#fff;background:rgba(255,255,255,.035);font-size:.78rem}.search-box input:focus{border-color:rgba(125,187,240,.48);background:rgba(43,130,212,.06)}.toolbar-note{color:#7890a6;font-size:.69rem}

    .pw-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;padding-bottom:36px}.pw-card{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:230px;padding:17px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:0 8px 20px rgba(0,0,0,.17);transition:transform .18s ease,border-color .18s ease}.pw-card:hover{transform:translateY(-3px);border-color:rgba(125,187,240,.4)}.pw-card::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:3px;background:linear-gradient(90deg,var(--blue),var(--red))}
    .pw-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.pw-title{font-family:"Rajdhani",sans-serif;font-size:1.15rem;font-weight:700;line-height:1.15}.badge{flex:0 0 auto;padding:4px 7px;border:1px solid rgba(214,61,85,.28);border-radius:6px;color:#ff9aaa;background:var(--red-soft);font-size:.58rem;font-weight:800;letter-spacing:.05em}.pw-sub{min-height:52px;margin-top:10px;color:var(--muted);font-size:.73rem;line-height:1.55}
    .pw-secret{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:auto;padding:10px;border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-soft)}.secret-text{min-width:0;display:flex;flex-direction:column;gap:4px;cursor:pointer}.secret-text .hint{color:#7890a6;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.secret-value{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;font-weight:800}.is-blurred .secret-value{filter:blur(8px);opacity:.78}.copy-btn{min-height:36px;padding:0 11px;border:0;border-radius:8px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--blue-dark),var(--blue));font-size:.67rem;font-weight:800}.copy-btn:hover{background:linear-gradient(90deg,var(--blue),var(--red))}

    .toast{position:fixed;left:50%;bottom:18px;z-index:9999;display:flex;align-items:center;gap:9px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(12,26,43,.97);box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:.2s ease}.toast.show{opacity:1;transform:translate(-50%,0)}.toast .dot{width:9px;height:9px;border-radius:50%;background:var(--green)}#toastText{font-size:.72rem;font-weight:700}
    .footer{padding:0 0 34px;text-align:center}.footer a{min-height:43px;display:inline-flex;align-items:center;gap:8px;padding:0 17px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.035);font-size:.74rem;font-weight:800}

    .access-shell{min-height:100vh;display:grid;place-items:center;padding:22px}.access-card{width:min(100%,900px);display:grid;grid-template-columns:.9fr 1.1fr;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}.access-visual{display:flex;flex-direction:column;justify-content:center;padding:34px;background:linear-gradient(145deg,rgba(24,53,85,.98),rgba(10,24,40,.98))}.access-visual img{width:76px;height:76px;margin-bottom:24px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.12)}.access-status{width:fit-content;padding:5px 8px;border:1px solid rgba(214,61,85,.27);border-radius:6px;color:#ff9aaa;background:var(--red-soft);font-size:.62rem;font-weight:800;text-transform:uppercase}.access-visual h1{font-size:clamp(2.1rem,5vw,3.6rem)}.access-visual p{color:var(--muted);font-size:.8rem;line-height:1.65}.access-content{padding:34px}.access-content h2{margin:7px 0 18px;font-family:"Rajdhani",sans-serif;font-size:2rem}.access-steps{display:grid;gap:9px}.access-steps div{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line-soft);border-radius:9px;background:rgba(255,255,255,.025);color:var(--muted);font-size:.75rem}.access-steps b{color:var(--blue-light)}.access-reason{display:flex;gap:9px;margin-top:13px;padding:10px;border:1px solid rgba(242,186,99,.22);border-radius:9px;color:#e2c48f;background:rgba(242,186,99,.06);font-size:.7rem}.access-actions{display:grid;gap:8px;margin-top:18px}.action-button{min-height:43px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:9px;cursor:pointer;color:#fff;font-size:.72rem;font-weight:800}.action-button.primary{border-color:transparent;background:var(--blue)}.action-button.whatsapp{border-color:rgba(75,210,154,.28);background:rgba(75,210,154,.10);color:#8ce4bd}.action-button.secondary{background:rgba(255,255,255,.035)}

    @media(max-width:760px){.nav{align-items:stretch;flex-direction:column;padding:14px 0}.nav-actions{width:100%}.nav-button,.user{flex:1}.hero-card{grid-template-columns:1fr}.hero-stat{width:100%}.toolbar{align-items:stretch;flex-direction:column}.search-box{max-width:none}.access-card{grid-template-columns:1fr}.access-visual,.access-content{padding:25px}}
    @media(max-width:500px){.wrap{width:min(var(--max),calc(100% - 18px))}.brand-copy small{display:none}.nav-actions{display:grid;grid-template-columns:1fr}.hero{padding-top:24px}.hero-card{padding:22px}.pw-container{grid-template-columns:1fr}.secret-value{max-width:150px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap nav">
      <a class="brand" href="painelsiqueirax.html" aria-label="Voltar ao painel">
        <img src="https://i.imgur.com/eKjFtd1.png" alt="Logo SiqueiraX">
        <span class="brand-copy"><strong>Senhas GM VIP</strong><small>Portal SiqueiraX</small></span>
      </a>
      <div class="nav-actions">
        <a class="nav-button" href="gamemodesvip.html"><i class="fas fa-gamepad"></i> Gamemodes VIP</a>
        <div class="user"><i class="fas fa-gem"></i><span id="userName">Usuário</span><small>VIP</small></div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <div class="hero-card">
          <div><span class="eyebrow">Biblioteca protegida</span><h1>Senhas das Gamemodes VIP</h1><p>Encontre rapidamente a senha de cada projeto, revele somente quando necessário e copie com um clique.</p></div>
          <div class="hero-stat"><span>Acesso da conta</span><strong>VIP ativo</strong></div>
        </div>
      </div>
    </section>

    <section class="wrap">
      <div class="toolbar">
        <div class="search-box"><i class="fas fa-magnifying-glass"></i><input type="text" id="search" placeholder="Buscar senha pelo nome da GM..." autocomplete="off"></div>
        <div class="toolbar-note">Senhas ocultas por segurança</div>
      </div>
      <div class="pw-container" id="pwContainer"></div>
    </section>
  </main>

  <div class="footer"><a href="painelsiqueirax.html"><i class="fas fa-arrow-left"></i> Voltar ao Painel</a></div>
  <div class="toast" id="toast"><span class="dot"></span><span id="toastText">Copiado!</span></div>

  <script>
document.addEventListener("DOMContentLoaded", async () => {
  const pwContainer = document.getElementById("pwContainer");
  const search = document.getElementById("search");
  const toast = document.getElementById("toast");
  const toastText = document.getElementById("toastText");

  /* ===============================
     BOX PROFISSIONAL – NÃO VIP
     =============================== */
  function renderNoVipBox(reason) {
    document.body.innerHTML = `
      <main class="access-shell">
        <section class="access-card">
          <div class="access-visual">
            <img src="https://i.imgur.com/eKjFtd1.png" alt="Logo SiqueiraX">
            <span class="access-status"><i class="fas fa-lock"></i> Área VIP protegida</span>
            <h1>Acesso exclusivo para membros VIP</h1>
            <p>As senhas desta biblioteca são liberadas somente para usuários com o cargo VIP ativo no Discord do SiqueiraX.</p>
          </div>

          <div class="access-content">
            <span class="section-label">Como liberar o acesso</span>
            <h2>Ative seu VIP</h2>

            <div class="access-steps">
              <div><b>01</b><span>Entre no Discord oficial da comunidade.</span></div>
              <div><b>02</b><span>Adquira ou renove seu acesso VIP.</span></div>
              <div><b>03</b><span>Volte à página e tente novamente.</span></div>
            </div>

            ${reason ? `<div class="access-reason"><i class="fas fa-circle-info"></i><span>${escapeHtml(reason)}</span></div>` : ""}

            <div class="access-actions">
              <a class="action-button primary" href="https://dsc.gg/siqueiraxsamp" target="_blank" rel="noopener">
                <i class="fab fa-discord"></i> Entrar no Discord
              </a>
              <a class="action-button whatsapp" href="https://wa.me/558296963727" target="_blank" rel="noopener">
                <i class="fab fa-whatsapp"></i> Falar no WhatsApp
              </a>
              <button class="action-button secondary" id="tryAgainBtn" type="button">
                <i class="fas fa-rotate-right"></i> Tentar novamente
              </button>
            </div>
          </div>
        </section>
      </main>`;

    document.getElementById("tryAgainBtn").addEventListener("click", () => {
      window.location.reload();
    });
  }

  function showToast(msg, ok=true){
    toastText.textContent = msg;
    const dot = toast.querySelector(".dot");
    dot.style.background = ok ? "var(--ok)" : "var(--warn)";
    toast.classList.add("show");
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(() => toast.classList.remove("show"), 2200);
  }

  async function copyText(text){
    try{
      await navigator.clipboard.writeText(text);
      showToast("Senha copiada com sucesso!");
    }catch{
      // fallback
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try{
        document.execCommand("copy");
        showToast("Senha copiada com sucesso!");
      }catch{
        showToast("Não consegui copiar. Copie manualmente.", false);
      }
      document.body.removeChild(ta);
    }
  }

  /* ===============================
     1) VERIFICA VIP (SEMPRE)
     =============================== */
  try {
    const r = await fetch("/.netlify/functions/vip-me", {
      credentials: "include",
      cache: "no-store"
    });

    if (!r.ok) {
      const reason = await r.text().catch(() => "");
      if (reason === "no_session" || reason === "invalid_session" || reason === "expired_session") {
        window.location.href = "loginvip.html";
        return;
      }
      renderNoVipBox(`Acesso VIP negado • ${reason || "sem_detalhe"}`);
      return;
    }
  } catch {
    renderNoVipBox("Não foi possível validar seu acesso VIP.");
    return;
  }

  /* ===============================
     2) RENDER SENHAS GM (JSON)
     =============================== */
  function render(list){
    pwContainer.innerHTML = list.map((it, idx) => {
      const name = it.name || it.title || `GM ${idx+1}`;
      const pass = (it.password ?? it.senha ?? it.pass ?? "").toString();
      const note = (it.note ?? it.obs ?? it.info ?? "").toString();
      const tag = (it.tag ?? "VIP").toString();

      // data-secret guarda a senha real, mas não printa ela "limpa" na tela.
      // Ela só aparece quando o usuário clicar.
      return `
        <div class="pw-card" data-name="${encodeURIComponent(name.toLowerCase())}">
          <div class="pw-top">
            <div class="pw-title">${escapeHtml(name)}</div>
            <div class="badge">💎 ${escapeHtml(tag)}</div>
          </div>

          ${note ? `<div class="pw-sub">${escapeHtml(note)}</div>` : `<div class="pw-sub" style="opacity:.75">Clique na senha borrada para revelar.</div>`}

          <div class="pw-secret is-blurred" data-secret="${encodeURIComponent(pass)}">
            <div class="secret-text" role="button" tabindex="0" aria-label="Revelar senha">
              <span class="hint">🔒 senha:</span>
              <span class="secret-value">${escapeHtml(pass || "—")}</span>
            </div>
            <button class="copy-btn" type="button">Copiar</button>
          </div>
        </div>
      `;
    }).join("");

    // bind events
    pwContainer.querySelectorAll(".pw-secret").forEach(box => {
      const secretText = box.querySelector(".secret-text");
      const copyBtn = box.querySelector(".copy-btn");

      const reveal = () => {
        if (!box.classList.contains("is-blurred")) return;
        box.classList.remove("is-blurred");
        // quando revela, garante que o texto exibido é exatamente o secret armazenado
        const raw = decodeURIComponent(box.getAttribute("data-secret") || "");
        box.querySelector(".secret-value").textContent = raw || "—";
        showToast("Senha revelada!");
      };

      secretText.addEventListener("click", reveal);
      secretText.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          reveal();
        }
      });

      copyBtn.addEventListener("click", async () => {
        const raw = decodeURIComponent(box.getAttribute("data-secret") || "");
        if (!raw) {
          showToast("Sem senha cadastrada.", false);
          return;
        }
        // se estiver borrada, revela primeiro (fica premium)
        reveal();
        await copyText(raw);
      });
    });
  }

  function escapeHtml(str){
    return (str ?? "").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  const res = await fetch(`/.netlify/functions/senhasgm?v=${Date.now()}`, {
  credentials: "include",
  cache: "no-store"
  });

  if (!res.ok) {
    pwContainer.innerHTML = `
      <div style="padding:1rem;opacity:.9">
        Erro ao carregar <b>senhas GM VIP</b> (HTTP ${res.status}).
      </div>`;
    return;
}

  const all = await res.json();
  render(all);

  if (search) {
    search.addEventListener("input", () => {
      const v = (search.value || "").toLowerCase().trim();
      if (!v) { render(all); return; }
      render(all.filter(it => {
        const name = (it.name || it.title || "").toLowerCase();
        return name.includes(v);
      }));
    });
  }
});
</script>
</body>
</html>
